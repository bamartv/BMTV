name: Update cookie

on:
  schedule:
    - cron: '*/6 * * * *'
  workflow_dispatch: # Allows manual triggering
  push:
    branches:
      - main
    paths:
      - 'script/cookie.py'

concurrency:
  group: update-playlist
  cancel-in-progress: true   # Cancels old runs so new ones start immediately

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz
          # Or if you have requirements.txt:
          # pip install -r requirements.txt

      - name: Run cookie.py
        run: python script/cookie.py

      - name: Commit and Push Changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cookie.json sportcookie.json
          git commit -m "Auto-update cookies: $(date -u)" || echo "No changes to commit"

          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break
            echo "Push failed, retrying ($i)..."
            sleep $((RANDOM % 10 + 1))
          done
