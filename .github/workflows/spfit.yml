name: SPFIT Playlist Updater

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - spfit.py

permissions:
  contents: write

jobs:
  generate-playlists:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          playwright install chromium

      - name: Run SPFIT updater
        run: |
          python spfit.py

      - name: Commit and push playlists
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git add spfit_vlc.m3u8 spfit_tivimate.m3u8

          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 0
          fi

          git commit -m "Auto-update SPFIT playlists - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          # Sync with latest remote changes before push
          git pull --rebase origin main

          git push origin HEAD:main
