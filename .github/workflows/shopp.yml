name: SHOPP Playlist Generator

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

# REQUIRED for git push
permissions:
  contents: write

jobs:
  generate-playlists:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt-dev python3-dev
          
      - name: Install Python packages
        run: |
          pip install aiohttp beautifulsoup4 html5lib lxml selectolax playwright "httpx[http2]" pytz

      - name: Install Playwright Browsers
        run: |
          playwright install --with-deps
          playwright install chromium

      - name: Run SHOPP generator
        run: |
          python shopp.py

      - name: Commit and push playlists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add shopp_vlc.m3u8 shopp_tivimate.m3u8

          if git diff --cached --quiet; then
            echo "No playlist changes"
            exit 0
          fi

          git commit -m "Auto-update SHOPP playlists"

          git pull --rebase origin main
          git push origin main
