name: Sports Data
on:
  schedule:
    - cron: '*/7 * * * *'
  workflow_dispatch:
  
jobs:
  update-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Configure Git User
        run: |
          git config user.name "sportlive18"
          git config user.email "271363488+sportlive18@users.noreply.github.com"
      - name: Sync and Update Log
        run: |
          export TZ="Asia/Kolkata"
          git pull origin main --rebase

          # ⬇️ NEW: Fetch Sports_data.m3u
          curl -sS -f -L -o Sports_data.m3u "https://raw.githubusercontent.com/sm-monirulislam/Upcoming-and-Live-Sports-Data/refs/heads/main/Sports_data.m3u" || echo "⚠️ Sports_data.m3u fetch failed"

          echo "🚀 SonyLiv Synced | IST: $(date +'%Y-%m-%d %H:%M:%S') | ID: $RANDOM" >> sonyliv.txt
      - name: Commit and Push
        run: |
          export TZ="Asia/Kolkata"
          git add Sports_data.m3u
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "SonyLiv Database Updated ✅ [$(date +'%d-%m-%Y %H:%M')]"
          git push origin main
